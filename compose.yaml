services:
  uptime-kuma:
    build:
      context: .
      dockerfile: doker/dockerfile
    image: uptime-kuma-custom:latest
    container_name: uptime-kuma
    networks:
      - kuma_net 
    ports:
      - "3001:3001"  # Map the container port "3001" to the host port "3001"
    volumes:
      - ./data:/app/data  # Configuring persistent storage
    environment:
      - UMASK=0022  # Set your file permissions manually
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
networks:
  kuma-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1442
